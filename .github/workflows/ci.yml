name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auth:
    name: auth (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -q test
        working-directory: services/auth

  go-services:
    name: go (gateway, messaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
        working-directory: services/gateway
      - run: go vet ./...
        working-directory: services/gateway
      - run: go test ./...
        working-directory: services/messaging
      - run: go vet ./...
        working-directory: services/messaging

  dotnet-services:
    name: dotnet (catalogue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Catalogue.Tests
        working-directory: services/catalogue

  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  python-services:
    name: python (presence, assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e services/presence -e services/assets
          pip install pytest httpx ruff
      - run: ruff check .
        working-directory: services/presence
      - run: ruff check .
        working-directory: services/assets
      - run: python -m pytest
        working-directory: services/presence
      - run: python -m pytest
        working-directory: services/assets

  dependency-scan:
    name: owasp dependency-check (auth)
    runs-on: ubuntu-latest
    # Advisory: runs weekly / on demand, never blocks the PR lane.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: dependency-check
        run: mvn -q -Psecurity dependency-check:aggregate -DskipTests
        working-directory: services/auth
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: services/auth/target/dependency-check-report.html
          if-no-files-found: ignore
