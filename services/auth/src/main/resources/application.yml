spring:
  application:
    name: auth
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: auth
    open-in-view: false
  flyway:
    enabled: true
    schemas: auth
    create-schemas: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:OpenMarket <no-reply@openmarket.dev>}
  kafka:
    # Producer for the transactional outbox relay only — auth publishes no
    # other Kafka traffic. The relay itself stays off unless explicitly on.
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # details are an internal diagnostic — default off, opt in per env
      show-details: ${HEALTH_SHOW_DETAILS:never}

server:
  port: 8080

grpc:
  server:
    # Internal IntrospectToken API for the gateway. Never published outside
    # the compose internal network; plaintext h2c (TLS deferred, documented).
    port: ${GRPC_SERVER_PORT:9090}

jwt:
  issuer: auth
  audience: openmarket
  access-ttl-minutes: 15
  refresh-ttl-days: 7
  key-path: ${JWT_KEY_PATH:keys/jwt-rsa.jwk}

auth:
  # Interactive API docs (/docs, swagger-ui) — public only where explicitly
  # enabled; the default is deny so a prod deploy can't leak the API surface.
  docs-public: ${AUTH_DOCS_PUBLIC:false}
  # Secure-by-default: browsers accept Secure cookies on http://localhost, so
  # dev is unaffected — but a forgotten env var in prod can no longer ship
  # session cookies over plain HTTP. Set AUTH_COOKIE_SECURE=false ONLY for
  # exotic local setups (non-localhost plain HTTP).
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # Comma-separated proxy IPs/CIDRs whose X-Forwarded-For we trust.
  # Empty = trust nobody (remoteAddr is always the client IP).
  trusted-proxy-ip: ${AUTH_TRUSTED_PROXY_IP:}
  # Frontend base URL used in emailed links
  app-url: ${APP_URL:http://localhost:3000}
  verification:
    email-verify-hours: 24
    password-reset-minutes: 60
  outbox:
    # Off by default: a prod deploy without Kafka must not silently hold
    # events. Compose (the dev environment) turns it on explicitly.
    relay: ${AUTH_OUTBOX_RELAY:false}
    poll-ms: ${AUTH_OUTBOX_POLL_MS:2000}
    send-timeout-ms: ${AUTH_OUTBOX_SEND_TIMEOUT_MS:5000}
    retention-days: ${AUTH_OUTBOX_RETENTION_DAYS:7}
    retention-cron: ${AUTH_OUTBOX_RETENTION_CRON:0 17 4 * * *}

discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  # Browser lands on the GATEWAY (only public entry), which proxies to auth
  redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:3000/api/v1/auth/discord/callback}
  authorize-url: ${DISCORD_AUTHORIZE_URL:https://discord.com/oauth2/authorize}
  token-url: ${DISCORD_TOKEN_URL:https://discord.com/api/oauth2/token}
  users-me-url: ${DISCORD_USERS_ME_URL:https://discord.com/api/users/@me}
  scopes: ${DISCORD_SCOPES:identify email}
  success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/auth/success}
  failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:3000/auth/failure}
  connect-timeout-ms: ${DISCORD_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${DISCORD_READ_TIMEOUT_MS:5000}

springdoc:
  swagger-ui:
    path: /docs