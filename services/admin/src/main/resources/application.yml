spring:
  application:
    name: admin
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/admin_db}
    username: om
    password: ${POSTGRES_PASSWORD:devpassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure: health
  endpoint:
    health:
      # never: the actuator payload can name DB hosts/users — the app's own
      # /health/ready answers a fixed-string error instead.
      show-details: never

server:
  port: 8085
