spring:
  application:
    name: admin
  # datasource comes from DatabaseConfig (libpq-style DATABASE_URL) — a
  # bare jdbc:${DATABASE_URL} prefix produces jdbc:postgres://... which the
  # JDBC driver rejects (surfaced on admin's first real boot)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # exposure is a map (include/exclude) — a bare scalar fails the
        # property bind at boot (surfaced on admin's first real start)
        include: health
  endpoint:
    health:
      # never: the actuator payload can name DB hosts/users — the app's own
      # /health/ready answers a fixed-string error instead.
      show-details: never

server:
  port: 8085
